<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a0e17">
    <title>Login - Your Family Store</title>
    <!-- website icon -->
    <link rel="website icon" type="jpg" href="https://cdn-icons-png.flaticon.com/512/6681/6681204.png">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom premium styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Central theme loader (immediate execution prevents FOUT) -->
    <script src="shared-storage.js"></script>
    <script src="theme.js"></script>
    <!-- Google Identity Services (GIS) Client Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="auth-bg">

    <!-- Sticky Glass Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <i class="fa-solid fa-laptop-code"></i> Your Family Store
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="index.html">
                            <i class="fa-solid fa-shop me-1"></i> Products
                        </a>
                    </li>
                    <li>
                        <button id="theme-toggle" class="theme-btn" type="button" aria-label="Toggle theme">
                            <i class="fas fa-sun"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Area -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card-premium shadow">
                    <h3 class="auth-title text-center">Login</h3>
                    <p class="auth-subtitle text-center">Access your profile and track your orders.</p>

                    <form id="login-form">
                        <div class="floating-input-group">
                            <label for="loginEmail" class="floating-label"><i class="fa-solid fa-envelope me-1"></i>
                                Email address</label>
                            <input type="email" class="form-control auth-input" id="loginEmail"
                                placeholder="yourname@example.com" required autocomplete="username">
                        </div>
                        <div class="floating-input-group">
                            <label for="loginPassword" class="floating-label"><i class="fa-solid fa-lock me-1"></i>
                                Password</label>
                            <div class="password-input-wrapper">
                                <input type="password" class="form-control auth-input" id="loginPassword"
                                    placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility" tabindex="-1">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-submit-auth mt-2"><i
                                class="fa-solid fa-sign-in-alt me-2"></i>Sign In</button>
                    </form>

                    <div class="separator-container">
                        <div class="separator-line"></div>
                        <span class="separator-text">or sign in with</span>
                        <div class="separator-line"></div>
                    </div>

                    <div class="d-flex flex-column gap-3 w-100 align-items-center mb-2">
                        <!-- Standard Google Login Button -->
                        <div id="google-signin-btn"></div>

                        <!-- Simulated Google Login Button (Fallback and Local Dev testing) -->
                        <button type="button" id="custom-google-btn" class="btn-google-simulated">
                            <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google Logo"
                                style="width: 18px; height: 18px;">
                            <span>Sign in with Google (Demo Simulator for visitor only)</span>
                        </button>
                    </div>

                    <div class="mt-4 text-center text-muted small">
                        Don't have an account yet? <a href="signup.html" class="auth-switch-link">Sign up</a>
                    </div>
                    <div class="mt-4 text-center text-muted small">
                        Are you an admin? <a href="admin-login.html" class="text-cyan text-decoration-none ms-1"><i
                                class="fa-solid fa-lock me-1"></i>Admin Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Google Sign-In Account Chooser Modal -->
    <div class="g-sim-modal-overlay" id="google-sim-modal-overlay">
        <div class="g-sim-modal">
            <div class="g-sim-modal-header">
                <button type="button" class="g-sim-modal-close" id="google-sim-modal-close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google Logo" class="g-sim-logo">
                <h4 class="g-sim-title">Choose an account(For demo/visitor Purpose)</h4>
                <p class="g-sim-subtitle">to continue to Tech World Store</p>
            </div>

            <div class="g-sim-accounts-list">
                <!-- Account 1 -->
                <button type="button" class="g-sim-account-item" data-email="alex.mercer@gmail.com"
                    data-name="Alex Mercer"
                    data-picture="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=150">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=150" alt="Alex Mercer"
                        class="g-sim-avatar">
                    <div class="g-sim-acc-info">
                        <p class="g-sim-acc-name">Alex Mercer</p>
                        <p class="g-sim-acc-email">alex.mercer@gmail.com</p>
                    </div>
                </button>

                <!-- Account 2 -->
                <button type="button" class="g-sim-account-item" data-email="sarah.connor@gmail.com"
                    data-name="Sarah Connor"
                    data-picture="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=150">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=150"
                        alt="Sarah Connor" class="g-sim-avatar">
                    <div class="g-sim-acc-info">
                        <p class="g-sim-acc-name">Sarah Connor</p>
                        <p class="g-sim-acc-email">sarah.connor@gmail.com</p>
                    </div>
                </button>
            </div>

            <button type="button" class="g-sim-other-btn" id="google-sim-other-btn">
                <i class="fa-solid fa-user-plus"></i> Use another account
            </button>

            <!-- Custom Account Form (Hidden initially) -->
            <form id="google-sim-custom-form" class="g-sim-custom-form">
                <div class="mb-3">
                    <label for="simName" class="form-label text-muted small mb-1 text-start d-block">Full Name</label>
                    <input type="text" class="form-control auth-input py-2" id="simName" placeholder="e.g. John Doe"
                        required>
                </div>
                <div class="mb-3">
                    <label for="simEmail" class="form-label text-muted small mb-1 text-start d-block">Email
                        address</label>
                    <input type="email" class="form-control auth-input py-2" id="simEmail"
                        placeholder="e.g. john.doe@gmail.com" required>
                </div>
                <button type="submit" class="btn-submit-auth py-2"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign
                    In</button>
            </form>
        </div>
    </div>

    <!-- Sleek Custom Toast Container -->
    <div class="custom-toast-container" id="toast-alerts-box"></div>

    <footer class="footer-custom py-5 mt-auto">
        <div class="container text-center small text-muted">
            &copy; 2026 TECH WORLD. SECURE TRANSACTION HANDLER.
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>

</html>
