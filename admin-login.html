<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0a0e17">
    <title>Admin Login - Tech World</title>
    <!-- website icon -->
    <link rel="website icon" type="jpg" href="https://png.pngtree.com/png-clipart/20240604/original/pngtree-icon-shopping-store-design-for-ecommerce-website-vector-picture-image_15485092.png">
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom premium styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Central theme loader (immediate execution prevents FOUT) -->
    <script src="theme.js"></script>
</head>
<body class="auth-bg">

    <!-- Sticky Glass Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="brand-logo" href="index.html">
                <i class="fa-solid fa-laptop-code text-cyan"></i> Tech World Admin
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="index.html">
                            <i class="fa-solid fa-shop me-1"></i> Storefront
                        </a>
                    </li>
                    <li>
                        <button id="theme-toggle" class="theme-btn" type="button" aria-label="Toggle theme">
                            <i class="fas fa-sun"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Admin Login Area -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card-premium shadow">
                    <div class="text-center mb-4">
                        <span class="badge bg-danger text-uppercase px-3 py-2 mb-2" style="font-family: var(--font-heading); letter-spacing: 1px;"><i class="fa-solid fa-user-shield me-1"></i> Admin Portal</span>
                        <h3 class="auth-title">Admin Sign In</h3>
                        <p class="auth-subtitle">Provide your administrative credentials to log in to the dashboard.</p>
                    </div>
                    
                    <form id="admin-login-form">
                        <div class="floating-input-group">
                            <label for="adminEmail" class="floating-label"><i class="fa-solid fa-envelope me-1"></i> Email address</label>
                            <input type="email" class="form-control auth-input" id="adminEmail" placeholder="admin@techworld.com" required autocomplete="username">
                        </div>
                        <div class="floating-input-group">
                            <label for="adminPassword" class="floating-label"><i class="fa-solid fa-lock me-1"></i> Password</label>
                            <input type="password" class="form-control auth-input" id="adminPassword" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn-submit-auth mt-2"><i class="fa-solid fa-sign-in-alt me-2"></i>Sign In to Dashboard</button>
                    </form>
                    
                    <div class="mt-4 text-center text-muted small">
                        Don't have an admin account? <a href="admin-register.html" class="auth-switch-link text-cyan">Create Admin Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Sleek Custom Toast Container -->
    <div class="custom-toast-container" id="toast-alerts-box"></div>

    <footer class="footer-custom py-5 mt-auto">
        <div class="container text-center small text-muted">
            &copy; 2026 Your Family Store. Certified secure administrator panel.
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script directly embedded for self-containment & clean page loading -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('admin-login-form');
            if (!form) return;

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const email = document.getElementById('adminEmail').value.trim();
                const password = document.getElementById('adminPassword').value.trim();

                try {
                    const admins = JSON.parse(localStorage.getItem('admins') || '[]');
                    const admin = admins.find(a => a.email === email && a.password === password);

                    if (admin) {
                        // Set admin session details
                        localStorage.setItem('currentAdmin', JSON.stringify({ name: admin.name, email: admin.email }));
                        
                        showToast('Login successful! Welcome to the Admin Vault.', 'success');
                        setTimeout(() => {
                            window.location.href = 'admin.html';
                        }, 1000);
                    } else {
                        // Fallback/Default admin credentials if none registered yet
                        if (email === 'admin@techworld.com' && password === 'admin123') {
                            localStorage.setItem('currentAdmin', JSON.stringify({ name: 'System Admin', email: 'admin@techworld.com' }));
                            showToast('Default Login successful! Welcome to the Admin Vault.', 'success');
                            setTimeout(() => {
                                window.location.href = 'admin.html';
                            }, 1000);
                        } else {
                            showToast('Invalid administrative credentials. Please try again.', 'error');
                        }
                    }
                } catch (error) {
                    showToast('Admin login failed. Please try again.', 'error');
                }
            });
        });

        // Toast popup utility
        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toast-alerts-box');
            if (!toastContainer) return;

            const toast = document.createElement('div');
            toast.className = 'custom-toast';
            
            let iconClass = 'fa-check-circle';
            if (type === 'error') {
                iconClass = 'fa-exclamation-circle';
                toast.style.borderLeftColor = 'var(--accent-danger)';
            }

            toast.innerHTML = `
                <i class="fa-solid ${iconClass} custom-toast-icon" style="color: ${type === 'error' ? 'var(--accent-danger)' : 'var(--accent-cyan)'}"></i>
                <div class="custom-toast-body">${message}</div>
            `;

            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.add('show');
            }, 50);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 400);
            }, 3500);
        }
    </script>
</body>
</html>
